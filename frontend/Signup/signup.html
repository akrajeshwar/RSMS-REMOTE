<!doctype html>
<html>
  <head>
    <title>Sign Up</title>
    <link rel="stylesheet" href="signup.css" />
  </head>

  <body>
    <div class="signup-container">
    <div class="signup-card">
    

    <p id="signinpage" class="signin"></p>

    <form id="signupform">
        <h2>Sign up</h2>
        <label>Email</label>
        <input type="email" id="email" required>
        <small class="error" id="emailError"></small><br>

        <label>Password</label>
        <input type="password" id="psw" name="psw" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" required>
        <small class="error" id="passwordError"></small><br>

        <label>Mobile Number</label>
        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required>

        <button type="submit" id="submit_button">Sign up</button>
        <p><b>already an user?</b>
        <a href="frontend\login.html">Sign in</a></p>
    </form>
    </div>

    <div class="signupimage">
    <img src="https://plus.unsplash.com/premium_photo-1772955479826-614b2b120b78?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyfHx8ZW58MHx8fHx8" alt="signupimage" height="100%" width="100%">
    </div>
    </div>
    <script src="signup.js"></script>
  </body>
  
</html>
